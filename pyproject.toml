[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eco-loop"
version = "0.1.0"
description = "Autonomous AI Building Optimization System using EnergyPlus, LLM, and MCP"
authors = [{ name = "Eco-Loop Team" }]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "pandas>=2.2.2",
    "plotly>=5.22.0",
    "matplotlib>=3.9.0",
    "kaleido>=0.2.1",
    "jinja2>=3.1.4",
    "weasyprint>=62.3",
    "mcp>=1.0.0",
    "anyio>=4.4.0",
    "aiosqlite>=0.20.0",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "loguru>=0.7.2",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
]

[project.scripts]
eco-loop = "main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
